[theme]
base = "light"
primaryColor = "#12a5b2"
backgroundColor = "#f5f8fa"
secondaryBackgroundColor = "#eff6f8"
textColor = "#193d49"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = true
enableXsrfProtection = true
fileWatcherType = "none"
maxUploadSize = 1

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"
