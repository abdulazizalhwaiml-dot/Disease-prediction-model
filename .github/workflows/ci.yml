name: Validate NHANES system
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check src app tests scripts && ruff format --check src app tests scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser regression tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check all field headings and native help in Chromium
        env:
          MIZANAK_UI_OUTPUT: ${{ runner.temp }}/mizanak-ui
        run: |
          python -m streamlit run streamlit_app.py --server.headless true > "$RUNNER_TEMP/mizanak-streamlit.log" 2>&1 &
          mizanak_app_pid=$!
          trap 'kill "$mizanak_app_pid" 2>/dev/null || true' EXIT
          for mizanak_attempt in {1..30}; do
            if curl --fail --silent http://localhost:8501/_stcore/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:8501/_stcore/health
          node scripts/check_ui_layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-layout-evidence
          path: ${{ runner.temp }}/mizanak-ui/
      - run: python scripts/download_data.py
      # Real merged data, all four algorithms and all eight diseases.
      - run: python -m nhanes_ai.train --data DATA_SET --output models --reports reports --jobs 2
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: trained-models-and-evaluation
          path: |
            models/
            reports/
      - run: docker build -t nhanes-ai:ci .
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows-dev.lock
      - run: python -m pip install --require-hashes -r requirements-windows-dev.lock
      - run: python -m pip install --no-deps -e .
      # Use the shipped Linux-trained artifacts to verify Windows loading and inference.
      - run: python -m pytest -q
      - name: Check Windows PowerShell launcher syntax
        shell: powershell
        run: |
          $MizanParseTokens = $null
          $MizanParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/run_windows.ps1'),
            [ref] $MizanParseTokens, [ref] $MizanParseErrors
          ) | Out-Null
          if ($MizanParseErrors.Count -gt 0) {
            $MizanParseErrors | Write-Error
            exit 1
          }
