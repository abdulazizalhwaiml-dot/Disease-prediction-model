name: Package ready Mizanak release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Application version from pyproject.toml (without v)
        required: true
        default: "4.2.0"
permissions:
  contents: write
jobs:
  package-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Validate release version and paths
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Invalid version'
          assert version == tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          filename = 'MIZANAK_v' + version.replace('.', '_') + '.zip'
          archive = str(Path(os.environ['RUNNER_TEMP']) / filename)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'RELEASE_TAG=v{version}\nRELEASE_ARCHIVE={archive}\n')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          section = changelog.split(f'## {version} — ', 1)[1]
          section = section.split('\n', 1)[1].split('\n## ', 1)[0].strip()
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(
              f'Mizanak {version}\n\n'
              'Download the ZIP below, extract it, and run START_WINDOWS.bat with 64-bit Python 3.12. '
              'Stop the old application first.\n\n' + section + '\n\n'
              'Experimental research software, not a medical diagnosis.\n', encoding='utf-8')
          PY
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: pytest -q
      - name: Fetch original sources with pinned hashes
        run: python scripts/download_data.py
      - name: Build and verify complete ready archive
        run: python scripts/package_project.py --output "$RELEASE_ARCHIVE"
      - name: Publish downloadable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "Mizanak $RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
          gh release upload "$RELEASE_TAG" "$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE.sha256" --clobber
